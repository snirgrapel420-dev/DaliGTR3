name: Build DaliGTR

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  test:
    name: Engine + Sound Set tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine tests (C++, no JUCE)
        run: g++ -std=c++17 -O2 -Wall -Wextra -ISource tests/engine_tests.cpp -o engine_tests && ./engine_tests
      - name: Sound Set builder self-test (Python)
        run: |
          pip install numpy soundfile
          python tools/soundset/selftest.py

  build:
    name: ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            cmake_args: -A x64
          - name: macOS
            os: macos-latest
            cmake_args: -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt') }}
      - name: Configure
        shell: bash
        run: >
          cmake -B build ${{ matrix.cmake_args }} -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DDALIGTR_SOUNDSET_URL="https://github.com/${{ github.repository }}/releases/download/soundset-v1/DaliGTR-SoundSet.zip"
      - name: Build
        shell: bash
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 4
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $art = "build/DaliGTR_artefacts/${{ env.BUILD_TYPE }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$art/VST3/DaliGTR.vst3" -DestinationPath "dist/DaliGTR-Windows-VST3.zip"
          Compress-Archive -Path "$art/Standalone/DaliGTR.exe" -DestinationPath "dist/DaliGTR-Windows-Standalone.zip"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ART="build/DaliGTR_artefacts/${{ env.BUILD_TYPE }}"
          mkdir -p dist
          codesign --force --deep -s - "$ART/VST3/DaliGTR.vst3"
          codesign --force --deep -s - "$ART/Standalone/DaliGTR.app"
          ditto -c -k --keepParent "$ART/VST3/DaliGTR.vst3" dist/DaliGTR-macOS-VST3.zip
          ditto -c -k --keepParent "$ART/Standalone/DaliGTR.app" dist/DaliGTR-macOS-Standalone.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DaliGTR-${{ matrix.name }}
          path: dist/*.zip

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
